name: release

# One namespace per plugin. The bare `v` tag has always meant anatomiya and
# still does, so nothing already pushed changes meaning; anything else carries
# the name of the plugin it releases. `scripts/release.mjs` holds the same table
# and a test holds the two in step.
on:
  push:
    tags: ["v*.*.*", "ultracode-anywhere-v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # A test that hangs (a blocking open on a fifo, say) fails here instead of
    # holding the runner for the six-hour default. This job runs the same suite
    # as ci, and it is the one whose result cannot be taken back.
    timeout-minutes: 30
    # Write is needed for one thing: creating the release. Nothing else in this
    # workflow writes, so nothing else gets the permission.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      # Which plugin this tag releases, whether every manifest that plugin owns
      # carries that version, and the changelog section that becomes the release
      # body. One module rather than shell, because a release cannot be taken
      # back and nothing could run the shell until a tag was already pushed.
      - name: Resolve the tag
        id: release
        shell: bash
        run: |
          node scripts/release.mjs "$GITHUB_REF_NAME" \
            --notes "$RUNNER_TEMP/notes.md" \
            --github-output "$GITHUB_OUTPUT"
          echo "release notes:"
          cat "$RUNNER_TEMP/notes.md"

      - run: npm ci

      # The runner image ships no prism, so without this the release would run
      # with every Ruby test skipped and ship a tier nothing verified.
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"

      # Required, not optional. Ruby is installed above, so a failure here is a
      # real one, and a release that skipped the Ruby tier would ship eleven
      # dimensions and a prism child that nothing verified.
      - name: Check the Ruby parser
        shell: bash
        run: |
          version=$(ruby --disable-gems -rprism -e 'print Prism::VERSION') || {
            echo "::error::ruby -rprism failed, so the Ruby tier would not be tested before release"
            exit 1
          }
          echo "prism $version"

      # Every test, with no Ruby branch: the step above exits 1 when prism is
      # missing, so by here it is there. ci has the branch because six of its
      # legs may legitimately lack Ruby; a release may not.
      - name: Run the suite
        shell: bash
        run: |
          files=$(find test -name '*.test.mjs' | sort)
          # An empty list makes this `node --test`, which falls back to
          # discovery of its own and exits 0 having run nothing. ci refuses that
          # and this is the workflow where a green run nobody can take back.
          if [ -z "$files" ]; then
            echo "::error::found no test files under test/"
            exit 1
          fi
          # shellcheck disable=SC2086
          node --test $files

      # The release body is the changelog section the resolve step already read
      # and wrote, unedited. A tag with no section of its own never reached this
      # far: the resolve step refuses it rather than releasing another plugin's
      # notes under this plugin's name.
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN: ${{ steps.release.outputs.plugin }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # Latest is one badge for a repository that now releases two plugins,
          # and GitHub hands it to whichever release was made last. It belongs
          # to the plugin the repository is named for, and to no pre-release:
          # a version carrying a hyphen is one by semver, and the tag pattern
          # accepts it.
          latest=false
          prerelease=""
          case "$VERSION" in
            *-*) prerelease="--prerelease" ;;
            *) [ "$PLUGIN" = "anatomiya" ] && latest=true ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$PLUGIN $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest="$latest" $prerelease \
            --verify-tag
