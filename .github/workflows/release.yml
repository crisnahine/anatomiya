name: release

# One namespace per plugin. The bare `v` tag has always meant anatomiya and
# still does, so nothing already pushed changes meaning; anything else would
# carry the name of the plugin it releases. `scripts/release.mjs` holds the same
# table and a test holds the two in step.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A test that hangs (a blocking open on a fifo, say) fails here instead of
    # holding the runner for the six-hour default. This job runs the same suite
    # as ci, and it is the one whose result cannot be taken back.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      # A tag the release job would refuse is refused here, before the suite.
      - name: Resolve the tag
        shell: bash
        run: node scripts/release.mjs "$GITHUB_REF_NAME"

      - run: npm ci --ignore-scripts

      # The two gates ci's plugin job runs, before the suite: a tag points at
      # whatever commit it was put on, and until here nothing between the push
      # and the release read the documents or the manifests of that commit.
      - name: The documentation matches the code
        run: node scripts/check-docs.mjs

      - name: The manifests, the shipped set, the lockfile and the grammars
        run: npm run validate

      # The runner image ships no prism, so without this the release would run
      # with every Ruby test skipped and ship a tier nothing verified.
      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: "3.4"

      # Required, not optional. Ruby is installed above, so a failure here is a
      # real one, and a release that skipped the Ruby tier would ship every
      # Ruby dimension and a prism child that nothing verified.
      - name: Check the Ruby parser
        shell: bash
        run: |
          version=$(ruby --disable-gems -rprism -e 'print Prism::VERSION') || {
            echo "::error::ruby -rprism failed, so the Ruby tier would not be tested before release"
            exit 1
          }
          echo "prism $version"

      # Every test, with no Ruby branch: the step above exits 1 when prism is
      # missing, so by here it is there. ci has the branch because every leg
      # but one may legitimately lack Ruby; a release may not.
      - name: Run the suite
        shell: bash
        run: |
          files=$(find test -name '*.test.mjs' | sort)
          # An empty list makes this `node --test`, which falls back to
          # discovery of its own and exits 0 having run nothing. ci refuses that
          # and this is the workflow where a green run nobody can take back.
          if [ -z "$files" ]; then
            echo "::error::found no test files under test/"
            exit 1
          fi
          # shellcheck disable=SC2086
          node --test $files

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Write is needed for one thing: creating the release and its assets. A
    # step can change the PATH and environment of every later step in its job,
    # so the job holding the token installs nothing and runs no test: it
    # archives the plugin's directory out of git and runs no code of this
    # repository's. id-token and attestations are for the provenance step,
    # which signs that archive with this run's identity.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Which plugin this tag releases, whether every manifest that plugin owns
      # carries that version, and the changelog section that becomes the release
      # body. One module rather than shell, because a release cannot be taken
      # back and nothing could run the shell until a tag was already pushed.
      - name: Resolve the tag
        id: release
        shell: bash
        run: |
          node scripts/release.mjs "$GITHUB_REF_NAME" \
            --notes "$RUNNER_TEMP/notes.md" \
            --github-output "$GITHUB_OUTPUT"
          echo "release notes:"
          cat "$RUNNER_TEMP/notes.md"

      # The asset a release carries is the plugin's directory as the tagged
      # commit holds it, which is what `/plugin install` copies. Out of git
      # rather than npm pack: npm never packs a package-lock.json, and the
      # lockfile beside the manifest is what Claude Code installs the plugin's
      # dependencies from. The directory is named after the plugin, which the
      # marketplace's one entry holds, and git refuses a name with no directory.
      - name: Archive the plugin
        shell: bash
        env:
          PLUGIN: ${{ steps.release.outputs.plugin }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          git archive --format=tar.gz --prefix="$PLUGIN/" -o "$RUNNER_TEMP/dist/$PLUGIN-$VERSION.tgz" "HEAD:plugins/$PLUGIN"
          tar -tzf "$RUNNER_TEMP/dist/$PLUGIN-$VERSION.tgz" | grep -qx "$PLUGIN/package-lock.json" || {
            echo "::error::the archive of plugins/$PLUGIN holds no package-lock.json"
            exit 1
          }
          (cd "$RUNNER_TEMP/dist" && sha256sum "$PLUGIN-$VERSION.tgz" > SHA256SUMS && cat SHA256SUMS)

      # SLSA provenance for the tarball, signed through Sigstore with this run's
      # OIDC identity and recorded against the repository, so
      # `gh attestation verify <tarball> --repo crisnahine/anatomiya` answers
      # which workflow at which commit built it.
      - name: Attest the tarball
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/*.tgz

      # The same statement beside the tarball, in the two shapes a reader looks
      # for: the Sigstore bundle as the step wrote it, and its DSSE envelope
      # alone as an in-toto provenance file. Refused rather than written where
      # the bundle holds no in-toto statement.
      - name: Write the provenance beside the tarball
        shell: bash
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          PLUGIN: ${{ steps.release.outputs.plugin }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          jq -e '.dsseEnvelope.payloadType == "application/vnd.in-toto+json"' "$BUNDLE" > /dev/null || {
            echo "::error::the attestation bundle at $BUNDLE holds no in-toto statement"
            exit 1
          }
          cp "$BUNDLE" "$RUNNER_TEMP/dist/$PLUGIN-$VERSION.tgz.sigstore.json"
          jq -c '.dsseEnvelope' "$BUNDLE" > "$RUNNER_TEMP/dist/$PLUGIN-$VERSION.tgz.intoto.jsonl"
          ls -l "$RUNNER_TEMP/dist"

      # The release body is the changelog section the resolve step already read
      # and wrote, unedited. A tag with no section of its own never reached this
      # far: the resolve step refuses it rather than releasing another plugin's
      # notes under this plugin's name. The assets are everything the two steps
      # above left in dist: the tarball, its checksum, the bundle and the
      # provenance file.
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN: ${{ steps.release.outputs.plugin }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # Latest is one badge, and GitHub hands it to whichever release was
          # made last. It belongs to the plugin the repository is named for, and
          # to no pre-release: a version carrying a hyphen is one by semver, and
          # the tag pattern accepts it.
          latest=false
          prerelease=""
          case "$VERSION" in
            *-*) prerelease="--prerelease" ;;
            *) [ "$PLUGIN" = "anatomiya" ] && latest=true ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$PLUGIN $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest="$latest" $prerelease \
            --verify-tag \
            "$RUNNER_TEMP"/dist/*
