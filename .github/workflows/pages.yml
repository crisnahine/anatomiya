name: pages

# The website (G24): site/ filled in by scripts/site.mjs from the commit it is
# built at, including the code index a scan of that commit writes for the find
# demo. A pull request builds it and publishes nothing. The repository's Pages
# source has to be "GitHub Actions" for the deploy job to publish.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "site/**"
      - "scripts/site.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and a newer push waits for it rather than cutting it
# off half published. A pull request's build is superseded by its next push.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --ignore-scripts

      # Scans this checkout, then writes the page, its modules and the index
      # into _site. It refuses where a placeholder, a README heading or the
      # reuse tables it reads are missing, rather than publish braces.
      - name: Build the site
        run: node scripts/site.mjs _site

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # Holds the only write token in this workflow and runs nothing but the
  # deploy action: the job that installed packages and scanned is done.
  deploy:
    name: deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
