name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read is all any job here needs. No job writes to the repository, posts a
# comment, or touches a package registry.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The tool spawns child processes, reads git, and shells out, so one platform
  # would miss real breakage: spawn limits, path handling, and the git binary
  # all differ. Windows runs too, and it is the only way to know whether it
  # works: `ps` does not exist there and a replaced environment needs
  # %SystemRoot% before an interpreter will start at all. Whether it stays
  # green decides what the README is allowed to claim.
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A test that hangs (a blocking open on a fifo, say) fails here instead of
    # holding the runner for the six-hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # 3.4, not 3.3: 3.3 ships prism 0.19, which the parser child rejects by
      # version because a rescue chain and a constant path are spelled
      # differently there, and every count would silently come back zero. The
      # runner image ships no prism of its own, so without this the Ruby tier
      # would skip on every leg and half the tool would go untested behind a
      # green tick.
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"

      # One leg REQUIRES Ruby. Skipping everywhere is how half the tool goes
      # untested in silence: the six Ruby dimensions, the prism child, and the
      # Rails data dimensions all live behind this check, and a runner image
      # that drops Ruby would take them all out with a green tick.
      - name: Check the Ruby parser
        id: ruby
        shell: bash
        env:
          REQUIRED: ${{ matrix.os == 'ubuntu-latest' && matrix.node == '22' }}
        run: |
          if version=$(ruby --disable-gems -rprism -e 'print Prism::VERSION' 2>/dev/null); then
            echo "prism $version"
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$REQUIRED" = "true" ]; then
            echo "::error::ruby -rprism failed on the leg that must run the Ruby tier."
            echo "::error::prism 1.x is a default gem from Ruby 3.4. Every Ruby test would have been skipped."
            exit 1
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the suite
        shell: bash
        env:
          RUBY_AVAILABLE: ${{ steps.ruby.outputs.available }}
        run: |
          files=$(find test -name '*.test.mjs' | sort)
          if [ "$RUBY_AVAILABLE" != "true" ]; then
            files=$(printf '%s\n' "$files" | grep -v 'ruby\.test\.mjs$' || true)
            echo "::warning::ruby -rprism failed on this runner. Skipping the Ruby parser tests. Every other test still runs."
          fi
          if [ -z "$files" ]; then
            echo "::error::found no test files under test/"
            exit 1
          fi
          # shellcheck disable=SC2086
          node --test $files

  # A number that only ever gets quoted is worse than none, so the floors are
  # enforced rather than reported. `scripts/coverage.mjs` holds them and states
  # what each was measured at; the numbers are not repeated here, because two
  # prose copies of one measurement is two things to keep in step and they had
  # already drifted apart. What is worth saying twice is why the line share is
  # the lowest of the three: it carries the corpus harness, which a test imports
  # for its table builders and which CI never runs.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # A test that hangs (a blocking open on a fifo, say) fails here instead of
    # holding the runner for the six-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"

      - run: npm ci

      # One run, and every floor read off its record rather than off the total
      # node prints. A floor over a whole scope says nothing about one file
      # inside it: the second plugin's `hook-io.mjs` sat under the branch floor
      # both when the aggregate spanned the whole suite and when it was scoped
      # to that plugin alone, because what an aggregate hides is proportional to
      # how much larger the rest of the scope is. Measured on the whole tree, 13
      # of 151 files sit under their own floor with the total clearing, and the
      # largest module in the plugin's `lib/` could have lost every covered line
      # unnoticed. The second plugin's five files and that `lib/`'s 51 are each
      # now, and the run states which file missed.
      - name: Measure and enforce
        shell: bash
        run: |
          node scripts/coverage.mjs --summary "$RUNNER_TEMP/cov.txt" $(find test -name '*.test.mjs' | sort)

      # Read from the file the script was asked to write rather than picked out
      # of its output: a pattern here is a second copy of one fact, it went
      # quietly empty when a scope was renamed, and it matched any line a test
      # happened to print at column zero.
      - name: Summarise
        if: always()
        shell: bash
        run: |
          {
            echo "### Coverage"
            echo
            echo '```'
            if [ -s "$RUNNER_TEMP/cov.txt" ]; then
              cat "$RUNNER_TEMP/cov.txt"
            else
              echo "(not measured: the run did not reach its own summary)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # A malformed manifest fails at plugin load time with an error that does not
  # name the cause, so it is worth catching here rather than in someone's
  # session.
  plugin:
    name: plugin manifests
    runs-on: ubuntu-latest
    # A test that hangs (a blocking open on a fifo, say) fails here instead of
    # holding the runner for the six-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - run: npm ci

      # Every number in the prose that the code also states. Both drifted in one
      # afternoon: the README claimed 21 dimensions after 31 shipped, and a gate
      # table listed floors the gates had stopped reading. A reader cannot tell
      # a stale number from a true one.
      - name: The documentation matches the code
        run: node scripts/check-docs.mjs

      # Every plugin the marketplace lists, read as a plugin: its own manifest,
      # the paths that manifest names, and the files its hooks run. This ran as
      # a heredoc here as well, and two copies of one contract is the failure
      # this repository keeps writing tests against. The script is the copy that
      # has tests.
      - name: The manifests are valid
        run: node scripts/validate.mjs

      # The plugin root is the repository root, so nothing about the tree says
      # which files belong to the plugin. `package.json` files is the one list
      # that does, and unread it was wrong in both directions: no `hooks/`,
      # which the loader reads first, and a marketplace manifest shipped inside
      # the plugin. npm answers what the list covers; this reads that answer
      # against what the hooks and command files reach. Linux only, because npm
      # on Windows is a batch file and nothing here spawns a shell.
      - name: The shipped set holds what the plugin loads
        run: node scripts/shipped.mjs

  # A unit suite that passes while the binary is broken is a familiar failure,
  # so the binary runs against a real repository with real git history. Both
  # platforms, because this is the step that spawns the parser pool and shells
  # out to git for real.
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A test that hangs (a blocking open on a fifo, say) fails here instead of
    # holding the runner for the six-hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Pinned to a tag so a change upstream cannot turn this red on its own.
      # Small, MIT, plain JavaScript, several directories deep enough to become
      # areas, and enough history for the author gate to have something to count.
      SMOKE_REPO: https://github.com/expressjs/express.git
      SMOKE_REF: v5.2.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Scan a real repository
        shell: bash
        run: |
          git clone --quiet --depth 50 --branch "$SMOKE_REF" "$SMOKE_REPO" "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          node "$GITHUB_WORKSPACE/plugins/anatomiya/bin/anatomiya.mjs" scan . | tee "$RUNNER_TEMP/scan.out"

      - name: Check it wrote what it said it wrote
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/check-output.mjs" <<'CHECK'
          import { readFileSync, readdirSync, existsSync } from "node:fs";
          import { join } from "node:path";

          const repo = process.argv[2];
          const stdout = readFileSync(process.argv[3], "utf8");
          const rules = join(repo, ".claude/rules");
          const problems = [];

          if (!existsSync(rules)) {
            console.error("::error::the scan wrote no .claude/rules directory");
            process.exit(1);
          }

          const written = readdirSync(rules).filter((f) => f.startsWith("anatomiya-") && f.endsWith(".md"));

          if (!written.includes("anatomiya-overview.md")) {
            problems.push("no anatomiya-overview.md on disk");
          }

          // The command prints a count. The count and the disk have to agree,
          // which is the whole point of running the binary rather than the
          // functions it calls.
          const claimed = stdout.match(/wrote (\d+) files?/);
          if (!claimed) problems.push("the scan printed no \"wrote N file(s)\" line");
          else if (Number(claimed[1]) !== written.length) {
            problems.push(`the scan says it wrote ${claimed[1]} files, ${written.length} are on disk`);
          }

          if (!existsSync(join(repo, ".claude/anatomiya/facts.json"))) {
            problems.push("no .claude/anatomiya/facts.json, so nothing rendered is derivable");
          }

          // A trailing /** is stripped by the matcher before matching, so
          // "app/**" becomes "app" and any exclusion written under it silently
          // does nothing. It is the kind of thing that regresses quietly, and it
          // is only visible in the rendered output.
          let globs = 0;
          for (const file of written) {
            const body = readFileSync(join(rules, file), "utf8");
            const front = body.match(/^---\r?\n([\s\S]*?)\r?\n---/);
            if (!front) continue;
            for (const line of front[1].split(/\r?\n/)) {
              const m = line.match(/^\s*-\s*"(.+)"\s*$/);
              if (!m) continue;
              globs++;
              if (/\/\*\*$/.test(m[1])) {
                problems.push(`${file} has a glob ending in a bare /**: ${m[1]}`);
              }
            }
          }

          if (problems.length) {
            for (const p of problems) console.error(`::error::${p}`);
            process.exit(1);
          }
          console.log(`${written.length} files written, ${globs} globs checked, none ends in a bare /**`);
          CHECK
          node "$RUNNER_TEMP/check-output.mjs" "$RUNNER_TEMP/smoke" "$RUNNER_TEMP/scan.out"

      # A5 end to end. The overview loads on every turn, so it is only affordable
      # on a cached read, and a unit test on the renderer cannot see a timestamp
      # that arrives from the corpus or the baseline.
      - name: Scan again and prove the overview did not move
        shell: bash
        run: |
          cd "$RUNNER_TEMP/smoke"
          cp .claude/rules/anatomiya-overview.md "$RUNNER_TEMP/overview-1.md"
          node "$GITHUB_WORKSPACE/plugins/anatomiya/bin/anatomiya.mjs" scan . >/dev/null
          if ! cmp -s "$RUNNER_TEMP/overview-1.md" .claude/rules/anatomiya-overview.md; then
            echo "::error::the overview changed between two scans of unchanged source"
            diff -u "$RUNNER_TEMP/overview-1.md" .claude/rules/anatomiya-overview.md | head -40
            exit 1
          fi
          echo "the overview is byte-identical across two scans"

      # `scan` alone left the other two commands untested end to end, and the
      # baseline is what every gate reads: unpinned, no finding can exceed FIX,
      # so a broken `pin` silently caps the whole tool at half its severity.
      - name: Pin, rescan against the baseline, then check a branch
        shell: bash
        run: |
          cd "$RUNNER_TEMP/smoke"
          BIN="$GITHUB_WORKSPACE/plugins/anatomiya/bin/anatomiya.mjs"

          node "$BIN" pin . | tee "$RUNNER_TEMP/pin.out"
          grep -qE "files? enters? the baseline population" "$RUNNER_TEMP/pin.out"
          test -f .claude/anatomiya/baseline.json

          # A second pin at the same commit must move nothing. It moving is how
          # a whole map drops to counts on an unchanged repository.
          node "$BIN" pin . --dry-run | tee "$RUNNER_TEMP/pin2.out"
          grep -qE "^0 files enter the baseline population, 0 leave it$" "$RUNNER_TEMP/pin2.out" \
            || { echo "::error::a second pin at the same commit moved the population"; exit 1; }

          node "$BIN" scan . | tee "$RUNNER_TEMP/scan2.out"
          grep -q "^baseline " "$RUNNER_TEMP/scan2.out" \
            || { echo "::error::the scan did not read the baseline it was just handed"; exit 1; }

          # A branch with one real edit, so `check` has a diff to walk rather
          # than reporting an empty run and passing for the wrong reason.
          git config user.email ci@example.test
          git config user.name ci
          git checkout -q -b smoke-edit
          printf '\nlet smokeMutable = 1\nexport { smokeMutable }\n' >> "$(git ls-files '*.js' | head -1)"
          git commit -qam "smoke edit"
          node "$BIN" check . --base "$SMOKE_REF" | tee "$RUNNER_TEMP/check.out"
          grep -qE "MUST-FIX, [0-9]+ FIX, [0-9]+ NIT" "$RUNNER_TEMP/check.out" \
            || { echo "::error::check printed no verdict line"; exit 1; }

      # The record is what a job reads instead of matching the sentences above,
      # so a writer nothing runs is a writer that breaks quietly.
      - name: Read the same check as a record
        shell: bash
        run: |
          cd "$RUNNER_TEMP/smoke"
          node "$GITHUB_WORKSPACE/plugins/anatomiya/bin/anatomiya.mjs" check . --base "$SMOKE_REF" --format json \
            > "$RUNNER_TEMP/check.json"
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if (!r.schema || !r.counts) {
              console.error("::error::the JSON report carries no schema or no counts");
              process.exit(1);
            }
            console.log("schema", r.schema, "counts", JSON.stringify(r.counts));
          ' "$RUNNER_TEMP/check.json"

      # The third writer, for the same reason: it is the one a pull-request job
      # reads, and nothing else here had ever run it.
      - name: Read the same check as annotations
        shell: bash
        run: |
          cd "$RUNNER_TEMP/smoke"
          node "$GITHUB_WORKSPACE/plugins/anatomiya/bin/anatomiya.mjs" check . --base "$SMOKE_REF" --format github \
            > "$RUNNER_TEMP/check.github"
          grep -qE "^::notice::[0-9]+ MUST-FIX, [0-9]+ FIX, [0-9]+ NIT$" "$RUNNER_TEMP/check.github" \
            || { echo "::error::the annotations carry no counts line"; exit 1; }

      # The tier ships behind a flag, so nothing else in this workflow ever runs
      # it, and a leg that never runs is a leg that breaks quietly. One platform
      # is enough: the tier is Node and TypeScript, and the platform-specific
      # surface is already covered by the other legs.
      - name: The optional checker is installed
        shell: bash
        run: node -e "import('typescript').then(t => console.log((t.default ?? t).version))"

      - name: Scan a TypeScript repository with the checker on
        shell: bash
        env:
          DEEP_REPO: https://github.com/sindresorhus/got.git
          DEEP_REF: v14.4.7
        run: |
          git clone --quiet --depth 50 --branch "$DEEP_REF" "$DEEP_REPO" "$RUNNER_TEMP/deep" \
            || { echo "::warning::could not clone the deep smoke repository"; exit 0; }
          cd "$RUNNER_TEMP/deep"
          # The repository's own dependencies decide whether the checker can
          # resolve anything, and that is the one thing this tier needs that
          # nothing else here does (B8).
          npm ci --ignore-scripts --no-audit --no-fund >/dev/null 2>&1 \
            || echo "::warning::deep smoke ran without the repository's dependencies"
          node "$GITHUB_WORKSPACE/plugins/anatomiya/bin/anatomiya.mjs" scan . --deep | tee "$RUNNER_TEMP/deep.out"
          grep -qE "^[0-9]+ files?, [0-9]+ areas?" "$RUNNER_TEMP/deep.out" \
            || { echo "::error::--deep printed no summary line"; exit 1; }
          test -f .claude/rules/anatomiya-overview.md
          node -e '
            const f = JSON.parse(require("fs").readFileSync(".claude/anatomiya/facts.json", "utf8"));
            if (!f.semantic || f.semantic.ran !== true) { console.error("::error::--deep did not run the tier"); process.exit(1); }
            console.log("tier:", f.semantic.status, f.semantic.reason ?? "", "resolution", f.semantic.typedResolutionRate);
          '

      # The Ruby tier has no smoke coverage otherwise: the JS repository above
      # exercises none of prism, the six Ruby dimensions, or the Rails data
      # dimensions over db/schema.rb and db/migrate.
      # The runner image ships no prism, so the Ruby tier would skip everywhere
      # and half the tool would go untested behind a green tick. 3.4, not 3.3:
      # 3.3 ships prism 0.19, which the parser child rejects by version because
      # a rescue chain and a constant path are spelled differently there and
      # every count would silently come back zero.
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"

      - name: Scan a Ruby repository
        shell: bash
        env:
          RUBY_REPO: https://github.com/sidekiq/sidekiq.git
          RUBY_REF: v8.1.1
        run: |
          if ! ruby --disable-gems -rprism -e 'print Prism::VERSION' >/dev/null 2>&1; then
            echo "::warning::no prism on this runner, skipping the Ruby smoke"
            exit 0
          fi
          git clone --quiet --depth 50 --branch "$RUBY_REF" "$RUBY_REPO" "$RUNNER_TEMP/ruby-smoke" \
            || { echo "::warning::could not clone the Ruby smoke repository"; exit 0; }
          cd "$RUNNER_TEMP/ruby-smoke"
          node "$GITHUB_WORKSPACE/plugins/anatomiya/bin/anatomiya.mjs" scan . | tee "$RUNNER_TEMP/ruby-scan.out"
          grep -qE "^[0-9]+ files?, [0-9]+ areas?" "$RUNNER_TEMP/ruby-scan.out"
          grep -q "could not be parsed" "$RUNNER_TEMP/ruby-scan.out" \
            && { echo "::error::prism failed on files in a real Ruby repository"; exit 1; }
          test -f .claude/rules/anatomiya-overview.md
