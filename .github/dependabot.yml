version: 2

# Monthly and grouped. There are three runtime dependencies and a handful of actions, so a
# weekly ungrouped schedule would open more pull requests than there is work.
updates:
  # The root only, on purpose. `plugins/anatomiya/package-lock.json` is not
  # resolved on its own: `scripts/plugin-lock.mjs` seeds it from this root
  # lockfile and prunes it to what the plugin declares, so the two never pin
  # different versions. An entry for `/plugins/anatomiya` would resolve that
  # directory afresh, which is the drift `plugin-lock.mjs --check` refuses.
  # A bump here that moves a runtime dependency is redone by hand with
  # `npm run lock:plugin`, since ci refuses a plugin lockfile left behind.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # The type checker is held to typescript major 5 (B7): 7 is the Go port with no JS
    # API, so a major bump only switches the checker off.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # `ignore` is the test oracle for how Claude Code reads `paths` (A10), so it moves
      # only when the version Claude Code bundles does, never on its own release.
      - dependency-name: ignore
      # A grammar's `.wasm` is vendored into the plugin and held to its package by hash,
      # so a bump is red until `npm run grammars` is run and the new file is committed.
      - dependency-name: "tree-sitter-*"
      - dependency-name: "@tree-sitter-grammars/*"
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
