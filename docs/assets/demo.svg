<title id="title">anatomiya in a Claude Code session</title>
<desc id="desc">A Claude Code session in mastodon, rebuilt from one measured trial&#x27;s files and answer: /anatomiya:scan maps the repository, the agent writes a badge component, the end-of-turn reuse check asks one subagent for an existing function, it names compareUrls, and the agent switches to it. Without the plugin, 20 of 20 trials wrote their own comparison.</desc>
